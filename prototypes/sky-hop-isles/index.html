<script>
'use strict';
// Sky Hop Isles: a low-poly 3D platformer. Jump across floating islands to the last flag.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 1280, H = 720;        // logical size of the HUD
const FONT = '"Apple SD Gothic Neo", "Noto Sans KR", "Trebuchet MS", sans-serif';
const TITLE = 'Sky Hop Isles';
const CONTROLS = [
  'WASD / 방향키: 이동',
  'Space: 점프 (길게 누르면 더 높이)',
  '마우스 드래그 / Q·E: 카메라 회전',
  'P: 일시정지 · M: 음소거',
];
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap'; // a headless shot or check: 3D draws cheap; players never see it
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen: a WebGL canvas with the HUD canvas over it ---------------------------------
const wrap = document.getElementById('wrap');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: !CHEAP });
renderer.setPixelRatio(CHEAP ? 0.5 : Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = !CHEAP;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; // keeps the palette's colours true
let composer = null; // the post-effects chain, made once the scene exists
function fit() { // fills the window at any size and pixel ratio, 16:9
  const s = Math.min(innerWidth / W, innerHeight / H);
  const r = s * (devicePixelRatio || 1);
  const cw = Math.round(W * s), ch = Math.round(H * s);
  wrap.style.width = cw + 'px'; wrap.style.height = ch + 'px';
  wrap.style.top = Math.max(0, Math.floor((innerHeight - ch) / 2)) + 'px';
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  ctx.setTransform(r, 0, 0, r, 0, 0);
  renderer.setSize(cw, ch);
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(cw, ch); }
}
addEventListener('resize', fit); fit();
function text(s, x, y, size, c, align = 'center', weight = 700) {
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(40,30,60,0.75)';
  ctx.strokeText(s, x, y); ctx.fillStyle = c; ctx.fillText(s, x, y);
}
function panel(x, y, w, h, a = 0.55) {
  ctx.fillStyle = `rgba(40,30,70,${a})`;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 18); ctx.fill();
}

// ---- Input: keys by position (event.code), OS key repeat ignored ------------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
let dragging = false, dragX = 0, yawInput = 0; // mouse drag turns the camera
addEventListener('pointerdown', e => { startAudio(); dragging = true; dragX = e.clientX; });
addEventListener('pointermove', e => { if (dragging) { yawInput -= (e.clientX - dragX) * tune.mouse_sensitivity; dragX = e.clientX; } });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('blur', () => { down.clear(); dragging = false; });

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted)); // the tweak panel (an add-on), when added, moved a value: the volume follows
function tone(freq, dur, type = 'square', vol = 0.3, delay = 0, slideTo = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
const sfx = {
  jump: () => tone(330, 0.14, 'square', 0.12, 0, 660),
  land: () => tone(140, 0.09, 'triangle', 0.35, 0, 70),
  stomp: () => { tone(520, 0.08, 'square', 0.15); tone(880, 0.12, 'square', 0.12, 0.06); },
  fall: () => tone(420, 0.35, 'sawtooth', 0.12, 0, 90),
  hurt: () => { tone(200, 0.2, 'sawtooth', 0.18); tone(120, 0.25, 'sawtooth', 0.15, 0.08); },
  checkpoint: () => [523, 659, 784].forEach((f, i) => tone(f, 0.18, 'triangle', 0.25, i * 0.08)),
  crumble: () => tone(90, 0.25, 'sawtooth', 0.12, 0, 50),
  win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.25, i * 0.11)),
};

// ---- Look: palette and low-poly pieces ---------------------------------------------------
const PAL = {
  grass: 0x7cc457, grassDark: 0x5a9e3c, dirt: 0xa8744a, rock: 0x8a5f3f, wood: 0xc98f52, woodDark: 0x8f5e33,
  stone: 0xeadfc6, stoneCrack: 0xb7a786, cloud: 0xffffff, leaf: 0x3f8f4a, leafLight: 0x5fb35a, trunk: 0x7a4e2c,
  hero: 0xf6eedc, skin: 0xffd2a8, cape: 0xe0393e, capeDark: 0xa81f2a, boot: 0x5a3a2a, eye: 0x2a2030,
  purple: 0x7b3fb5, purpleDark: 0x4e2380, orange: 0xff8a2a, orangeDark: 0xd2601a, white: 0xffffff,
  pole: 0xd8d2c8, flagOff: 0xf3f0ea, flagOn: 0x2fc6b3, gold: 0xffc43a,
};
const matCache = {};
function mat(c, extra) {
  const k = c + (extra ? JSON.stringify(extra) : '');
  if (!matCache[k]) matCache[k] = new THREE.MeshStandardMaterial(Object.assign({ color: c, flatShading: true, roughness: 0.85, metalness: 0 }, extra));
  return matCache[k];
}
function mesh(geo, c, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, typeof c === 'number' ? mat(c) : c);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

// The hero: a small cream figure in a red hood and cape. Model faces +z.
function makeHero() {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  mesh(new THREE.CylinderGeometry(0.26, 0.34, 0.55, 8), PAL.hero, 0, 0.42, 0, body);
  mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.08, 8), PAL.capeDark, 0, 0.66, 0, body); // collar
  mesh(new THREE.IcosahedronGeometry(0.3, 1), PAL.skin, 0, 0.95, 0, body);
  const hood = mesh(new THREE.ConeGeometry(0.34, 0.42, 8), PAL.cape, 0, 1.22, -0.03, body); hood.rotation.x = -0.25;
  mesh(new THREE.SphereGeometry(0.07, 6, 4), PAL.cape, 0, 1.38, -0.15, body); // hood tip bobble
  for (const sx of [-1, 1]) {
    mesh(new THREE.BoxGeometry(0.07, 0.11, 0.04), PAL.eye, sx * 0.1, 0.97, 0.27, body);
    mesh(new THREE.BoxGeometry(0.17, 0.12, 0.28), PAL.boot, sx * 0.14, 0.07, 0.03, body);
    const arm = mesh(new THREE.BoxGeometry(0.11, 0.34, 0.12), PAL.hero, sx * 0.36, 0.45, 0, body); arm.rotation.z = sx * 0.25;
  }
  const cape = mesh(new THREE.BoxGeometry(0.56, 0.62, 0.05), PAL.cape, 0, 0.4, -0.32, body); cape.rotation.x = 0.18;
  return { group: g, body, cape };
}
// The beetle patroller: low, wide, purple with an orange shell stripe and six legs.
function makeBeetle() {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const shell = mesh(new THREE.IcosahedronGeometry(0.55, 0), PAL.purple, 0, 0.48, -0.05, body); shell.scale.set(1, 0.62, 1.25);
  for (const [sx, sz] of [[-0.2, 0.15], [0.2, 0.15], [0, -0.3]]) { // orange shell spots
    const spot = mesh(new THREE.DodecahedronGeometry(0.17, 0), PAL.orange, sx, 0.74, sz - 0.05, body); spot.scale.y = 0.45;
  }
  mesh(new THREE.DodecahedronGeometry(0.3, 0), PAL.purpleDark, 0, 0.45, 0.62, body);
  for (const sx of [-1, 1]) {
    mesh(new THREE.BoxGeometry(0.13, 0.15, 0.06), PAL.white, sx * 0.13, 0.55, 0.86, body);
    mesh(new THREE.BoxGeometry(0.06, 0.08, 0.04), PAL.eye, sx * 0.13, 0.53, 0.9, body);
    const ant = mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.45, 4), PAL.purpleDark, sx * 0.14, 0.82, 0.78, body);
    ant.rotation.set(0.6, 0, -sx * 0.35);
    mesh(new THREE.SphereGeometry(0.07, 6, 4), PAL.orange, sx * 0.24, 1.0, 0.92, body);
    for (const lz of [-0.4, 0, 0.4]) {
      const leg = mesh(new THREE.BoxGeometry(0.42, 0.07, 0.07), PAL.purpleDark, sx * 0.6, 0.2, lz, body);
      leg.rotation.z = sx * -0.6;
    }
  }
  return { group: g, body };
}
// The spiky ball: an orange core bristling with purple spikes and angry eyes.
function makeSpiky() {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  mesh(new THREE.IcosahedronGeometry(0.44, 0), PAL.orange, 0, 0, 0, body);
  const ico = new THREE.IcosahedronGeometry(1, 0).getAttribute('position'), seen = new Set(), up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < ico.count; i++) {
    const v = new THREE.Vector3().fromBufferAttribute(ico, i).normalize(), k = v.toArray().map(n => n.toFixed(2)).join();
    if (seen.has(k)) continue; seen.add(k);
    const spike = mesh(new THREE.ConeGeometry(0.11, 0.38, 4), PAL.purple, v.x * 0.52, v.y * 0.52, v.z * 0.52, body);
    spike.quaternion.setFromUnitVectors(up, v);
  }
  for (const sx of [-1, 1]) {
    mesh(new THREE.BoxGeometry(0.14, 0.13, 0.05), PAL.white, sx * 0.14, 0.08, 0.41, body);
    mesh(new THREE.BoxGeometry(0.06, 0.07, 0.04), PAL.eye, sx * 0.13, 0.06, 0.44, body);
    const brow = mesh(new THREE.BoxGeometry(0.2, 0.05, 0.05), PAL.eye, sx * 0.14, 0.2, 0.43, body); brow.rotation.z = sx * 0.45;
  }
  return { group: g, body };
}
function makeTree(parent, x, y, z, s) {
  const t = new THREE.Group(); t.position.set(x, y, z); t.scale.setScalar(s); parent.add(t);
  mesh(new THREE.CylinderGeometry(0.13, 0.18, 0.9, 5), PAL.trunk, 0, 0.45, 0, t);
  mesh(new THREE.ConeGeometry(0.8, 1.4, 6), PAL.leaf, 0, 1.4, 0, t);
  mesh(new THREE.ConeGeometry(0.55, 1.0, 6), PAL.leafLight, 0, 2.1, 0, t);
}
function makeFlag(poleH, cloth, big) {
  const g = new THREE.Group();
  mesh(new THREE.CylinderGeometry(0.35 * big, 0.45 * big, 0.25, 7), PAL.stoneCrack, 0, 0.12, 0, g);
  mesh(new THREE.CylinderGeometry(0.05 * big, 0.05 * big, poleH, 6), PAL.pole, 0, poleH / 2, 0, g);
  const shape = new THREE.Shape(); shape.moveTo(0, 0); shape.lineTo(1.0 * big, -0.3 * big); shape.lineTo(0, -0.6 * big);
  const flagMat = new THREE.MeshStandardMaterial({ color: cloth, flatShading: true, side: THREE.DoubleSide, roughness: 0.8 });
  const flag = mesh(new THREE.ShapeGeometry(shape), flagMat, 0.04, poleH - 0.05, 0, g);
  return { group: g, flag, flagMat };
}

// ---- The course: data, built once ------------------------------------------------------
// Islands: [x, z, width, depth, top]. Movers glide a→b. Tiles crumble. Checkpoint 0 is the start.
const LEVEL = {
  start: [0, 3, 0],
  islands: [
    [0, 0, 10, 12, 0], [0, -11, 6, 6, 0], [0, -19, 7, 8, 1.8], [0, -44, 8, 8, 1.8],
    [0, -57, 12, 12, 2.6], [0, -84, 5, 10, 3.6], [0, -99, 5, 5, 4.2], [0, -110, 2.2, 14, 4.2],
    [0, -146, 10, 12, 5.4],
  ],
  movers: [
    { a: [0, 1.8, -27], b: [0, 1.8, -36], w: 3, d: 3, speed: 2.2 },
    { a: [-5, 3.6, -92.5], b: [5, 3.6, -92.5], w: 3, d: 3, speed: 3.2 },
    { a: [2, 5.4, -130], b: [2, 5.4, -137], w: 2.6, d: 2.6, speed: 2.8 },
  ],
  tiles: [[0, -66.5, 2.6], [1.5, -71, 3.1], [-0.5, -75.5, 3.6], [0, -120.5, 4.8], [2, -125, 5.4]],
  checkpoints: [[0, -19, 1.8], [0, -44, 1.8], [0, -80.5, 3.6], [0, -99, 4.2]],
  beetles: [{ a: [-4.5, -57], b: [4.5, -57], top: 2.6 }, { a: [0, -104.5], b: [0, -115.5], top: 4.2 },
            { a: [-4, -145], b: [4, -145], top: 5.4 }],
  spikies: [{ x: 0, z: -83, top: 3.6, phase: 0 }, { x: 0, z: -86.5, top: 3.6, phase: 0.5 },
            { x: 0, z: -142, top: 5.4, phase: 0.25 }],
  goal: [0, -149, 5.4],
  trees: [[-3.8, 4.5, 0, 1.1], [3.9, -4.6, 0, 0.9], [-2.7, -21.8, 1.8, 0.8], [4.8, -61.5, 2.6, 1], [-4.9, -52.5, 2.6, 0.85],
          [-4, -150.5, 5.4, 1.1], [4.1, -151, 5.4, 0.9]],
  hints: [[2, -3, 'Space로 점프'], [-12, -14.2, '길게 눌러 높이 점프'], [-24, -27, '움직이는 발판에 올라타기'],
          [-50, -56, '위에서 밟으면 쓰러져요'], [-64, -70, '금 간 타일은 곧 무너져요']],
};
const PR = 0.32, PH = 1.2; // the hero's collision half-width and height (inside the drawn body)

const scene3 = new THREE.Scene();
// A painted sky: blue overhead fading to peach at the horizon, with a sun disc and its glow.
// It also lights the world (an environment map baked from the same sky).
const SKY = { top: new THREE.Color(0x3f93dc), mid: new THREE.Color(0x9fd2f2), horizon: new THREE.Color(0xffcfa8), below: new THREE.Color(0xe9a894), sun: new THREE.Color(0xfff0d0) };
const sunDir = new THREE.Vector3();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: SKY.top }, mid: { value: SKY.mid }, horizon: { value: SKY.horizon }, below: { value: SKY.below }, sunColor: { value: SKY.sun }, sunDir: { value: sunDir } },
  vertexShader: `varying vec3 vDir;
    void main() { vDir = normalize(position); vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0); gl_Position = p.xyww; }`,
  fragmentShader: `uniform vec3 top, mid, horizon, below, sunColor, sunDir; varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir); float h = d.y;
      vec3 col = h > 0.0 ? mix(mix(horizon, mid, smoothstep(0.0, 0.18, h)), top, smoothstep(0.12, 0.7, h)) : mix(horizon, below, pow(-h, 0.4));
      float s = max(dot(d, normalize(sunDir)), 0.0);
      col += sunColor * (smoothstep(0.9993, 0.9997, s) * 12.0 + pow(s, 10.0) * 0.35 + pow(s, 120.0) * 0.6);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), skyMat); sky.frustumCulled = false; scene3.add(sky);
function aimSun() {
  sunDir.setFromSphericalCoords(1, THREE.MathUtils.degToRad(90 - tune.sun_elevation), THREE.MathUtils.degToRad(tune.sun_azimuth));
}
aimSun();
{
  const envScene = new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat));
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene3.environment = pmrem.fromScene(envScene, 0.04).texture; pmrem.dispose();
}
scene3.environmentIntensity = 0.6;
scene3.fog = new THREE.Fog(0xffcfa8, 45, 190); // warm haze toward the horizon
const cam = new THREE.PerspectiveCamera(60, W / H, 0.1, 2000);
scene3.add(new THREE.HemisphereLight(0xcfe2ff, 0x8a5a3c, 0.6));
const sun = new THREE.DirectionalLight(0xffdcae, 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004;
sun.shadow.radius = 5; sun.shadow.blurSamples = 12; // soft edges (VSM)
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 120 });
scene3.add(sun, sun.target);
// Post effects (never in the cheap headless render): ambient occlusion in the creases, bloom on
// the sun, lanterns and the gold star, then tone mapping.
let bloom = null, gtao = null;
if (!CHEAP) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene3, cam));
  gtao = new THREE.GTAOPass(scene3, cam, W, H);
  gtao.updateGtaoMaterial({ radius: 0.7, distanceExponent: 1.5, thickness: 1.5, scale: 1, samples: 16 });
  composer.addPass(gtao);
  bloom = new THREE.UnrealBloomPass(new THREE.Vector2(W, H), 0.4, 0.6, 0.85);
  composer.addPass(bloom);
  composer.addPass(new THREE.OutputPass());
  fit();
}

let decorSeed = 7; // decor only, so gameplay rng() stays untouched
function decorRand() { decorSeed = (decorSeed * 16807) % 2147483647; return decorSeed / 2147483647; }

const solids = []; // every collidable box: {minx,maxx,minz,maxz,top,bottom,on,kind}
function addSolid(o) { o.on = true; solids.push(o); return o; }
function boxAt(o, x, z, w, d) { o.minx = x - w / 2; o.maxx = x + w / 2; o.minz = z - d / 2; o.maxz = z + d / 2; }

for (const [x, z, w, d, top] of LEVEL.islands) {
  const g = new THREE.Group(); scene3.add(g);
  mesh(new THREE.BoxGeometry(w, 0.45, d), PAL.grass, x, top - 0.225, z, g);
  mesh(new THREE.BoxGeometry(w * 0.97, 1.0, d * 0.97), PAL.dirt, x, top - 0.95, z, g);
  const coneH = 2.5 + Math.max(w, d) * 0.3;
  const cone = mesh(new THREE.ConeGeometry(0.5, coneH, 7), PAL.rock, x, top - 1.45 - coneH / 2, z, g);
  cone.rotation.x = Math.PI; cone.scale.set(w * 0.95, 1, d * 0.95);
  for (let i = 0; i < Math.round(w * d / 12); i++) { // grass tufts along the edges
    const side = decorRand() < 0.5 ? -1 : 1, along = decorRand() - 0.5;
    const tuft = mesh(new THREE.ConeGeometry(0.12, 0.3, 4), PAL.grassDark, x + side * (w / 2 - 0.25), top + 0.12, z + along * (d - 0.6), g);
    tuft.castShadow = false;
  }
  const s = addSolid({ kind: 'island', top, bottom: top - 1.45 }); boxAt(s, x, z, w, d);
}
for (const [x, z, top, s] of LEVEL.trees) {
  makeTree(scene3, x, top, z, s);
  const t = addSolid({ kind: 'tree', top: top + 0.9 * s, bottom: top }); boxAt(t, x, z, 0.4 * s, 0.4 * s);
}
const movers = LEVEL.movers.map(m => {
  const g = new THREE.Group(); scene3.add(g);
  mesh(new THREE.BoxGeometry(m.w, 0.35, m.d), PAL.wood, 0, -0.175, 0, g);
  for (const sx of [-1, 1]) mesh(new THREE.BoxGeometry(0.18, 0.4, m.d + 0.04), PAL.woodDark, sx * (m.w / 2 - 0.12), -0.2, 0, g);
  const prop = mesh(new THREE.ConeGeometry(0.35, 0.8, 5), PAL.woodDark, 0, -0.75, 0, g); prop.rotation.x = Math.PI;
  const len = Math.hypot(m.b[0] - m.a[0], m.b[2] - m.a[2]);
  return addSolid(Object.assign({ kind: 'mover', g, len, t: 0, x: m.a[0], z: m.a[2], prev: [m.a[0], m.a[2]], dx: 0, dz: 0, top: m.a[1], bottom: m.a[1] - 0.4 }, m));
});

    update(dt) { state.t += dt; },
    draw() {
      render3D('figures'); ctx.clearRect(0, 0, W, H);
      const v = new THREE.Vector3();
      lineup.names.forEach((n, i) => { v.set(300 + lineup.xs[i], -0.6, 1.8).project(cam); text(n, (v.x + 1) / 2 * W, (1 - v.y) / 2 * H, 26, '#ffffff'); });
    },
  },
  title: {
    update(dt) { state.t += dt; if (pressed('Enter') || pressed('Space')) { reset(); scene = 'play'; } },
    draw() {
      render3D('title'); ctx.clearRect(0, 0, W, H);
      panel(W / 2 - 330, 110, 660, 470, 0.5);
      text(TITLE, W / 2, 190, 76, '#ffffff');
      text('하늘섬을 건너 마지막 황금 깃발까지', W / 2, 262, 28, '#ffe0a8', 'center', 600);
      CONTROLS.forEach((c, i) => text(c, W / 2, 340 + i * 44, 24, '#ffffff', 'center', 600));
      if (Math.floor(state.t * 2) % 2 === 0) text('Enter 또는 Space로 시작', W / 2, 532, 28, '#ffd34a');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape')) { scene = 'pause'; return; }
      state.t += dt;
      updateWorld(dt); updateHero(dt); checkTouches(); updateCamera(dt); updateDust(dt);
      if (state.fade > 0) state.fade -= dt;
    },
    draw() { render3D('play'); drawHUD(); },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape')) scene = 'play'; },
    draw() {
      scenes.play.draw(); ctx.fillStyle = 'rgba(30,20,50,0.45)'; ctx.fillRect(0, 0, W, H);
      text('일시정지', W / 2, H / 2 - 20, 56, '#ffffff'); text('P를 눌러 계속', W / 2, H / 2 + 40, 26, '#ffe0a8', 'center', 600);
    },
  },
  results: {
    update(dt) { goal.star.rotation.y += dt; if (pressed('Enter')) { reset(); scene = 'play'; } },
    draw() {
      render3D('play'); ctx.clearRect(0, 0, W, H);
      panel(W / 2 - 280, H / 2 - 150, 560, 300, 0.6);
      text(state.gained || '클리어!', W / 2, H / 2 - 88, 64, '#ffd34a');
      text(`기록 ${fmtTime(state.t)}`, W / 2, H / 2 - 10, 32, '#ffffff');
      text(`실수 ${state.falls}회`, W / 2, H / 2 + 36, 28, '#ffe0a8', 'center', 600);
      text('Enter: 다시 하기', W / 2, H / 2 + 100, 26, '#ffffff', 'center', 600);
    },
  },
};

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear();
}
let last, acc = 0;
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP; // draw between steps, so the view never judders
  drawFrame();
}
function drawFrame() { scenes[scene].draw(); }
function frame() { tick(); requestAnimationFrame(frame); }
// A headless browser on a time budget runs timers but almost no animation frames: a timer
// ticks when no frame has come for 100 ms on a visible page; a hidden tab stays paused.
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return Object.assign({}, state, { hero: { x: P.x, y: P.y, z: P.z, grounded: !!P.ground } }); },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; }, // the loop steps; a check empties it
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
